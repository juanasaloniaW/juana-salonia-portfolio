# Supabase pauses free projects after ~7 days without requests. The site only
# talks to Supabase when someone visits, so this pings it every 3 days with one
# tiny read. It reads the URL and the public (publishable) key from config.js,
# so it keeps working if the project ever changes.
# GitHub also switches off scheduled workflows after 60 days without repo
# activity; the last step re-enables this one on every run so that never happens.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 9 */3 * *"   # 09:17 UTC every 3rd day
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: read
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: config.js
          sparse-checkout-cone-mode: false

      - name: Query Supabase
        run: |
          URL=$(grep -oE 'SUPABASE_URL: *"[^"]+"' config.js | cut -d'"' -f2)
          KEY=$(grep -oE 'SUPABASE_ANON_KEY: *"[^"]+"' config.js | cut -d'"' -f2)
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/site_settings?select=key&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase answered HTTP $code"
          test "$code" = "200"

      - name: Keep this schedule switched on
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
